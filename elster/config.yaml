name: ELSTER-Übermittlung
version: "0.2.0"
slug: elster_uebermittlung
description: Holt Steueranmeldungen von einer Website ab und übermittelt sie mit ERiC an ELSTER
url: https://github.com/Tobinator86/h22-elster
arch:
  - amd64
init: false
startup: application
boot: auto
map:
  - type: share
    read_only: true
  - type: addon_config
    read_only: false
options:
  website_url: ""
  schluessel: ""
  testbetrieb: true
  hersteller_id: ""
  eric_datei: "/share/ERiC-44.3.6.0-Linux-x86_64.jar"
  zertifikat: "/config/zertifikat.pfx"
  pin: ""
  test_steuernummer: "1096081508187"
  intervall: 60
schema:
  website_url: str
  schluessel: password
  testbetrieb: bool
  hersteller_id: "match(^[0-9]{0,10}$)"
  eric_datei: str
  zertifikat: str
  pin: "password?"
  test_steuernummer: "match(^[0-9]{13}$)"
  intervall: "int(20,3600)"
